name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shvet_crm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: shvet_crm_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --no-check-publish
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: php artisan test
      # Static analysis gate. Larastan is installed here rather than in composer.json because its PHAR dependency
      # cannot be downloaded in the authoring sandbox. Pre-existing findings live in phpstan-baseline.neon;
      # anything new fails the build.
      - name: Static analysis (Larastan, level 5)
        run: |
          composer require --dev larastan/larastan --no-interaction --no-progress
          mkdir -p storage/framework/phpstan
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      # laravel-vite-plugin refuses to start a Vite server in CI; vitest only needs the config, not the HMR server.
      - run: npm test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
      - run: npm run build

  # Browser suites (Playwright + Chromium) against a seeded throwaway database, strict CSP (non-local APP_ENV).
  e2e:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: bash e2e/run.sh smoke crm meta whatsapp tools
      - name: Upload screenshots and server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            storage/e2e-screenshots
            storage/logs/e2e-server.log
          retention-days: 7
